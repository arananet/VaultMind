[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.backends._legacy:_Backend"

[project]
name = "vaultmind"
version = "0.3.0"
description = "Air-gapped knowledge appliance for offline LLM reasoning with RAG, Kiwix search, and GIS"
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
authors = [
    {name = "Eduardo Arana"},
]

dependencies = [
    "langchain>=0.3.0",
    "langchain-community>=0.3.0",
    "langchain-huggingface>=0.1.0",
    "sentence-transformers>=3.0.0",
    "faiss-cpu>=1.8.0",
    "pymupdf>=1.24.0",
    "ollama>=0.3.0",
    "click>=8.1.0",
    "rich>=13.0.0",
    "flask>=3.0.0",
    "pyyaml>=6.0",
    "sqlalchemy>=2.0.0",
    "alembic>=1.13.0",
    "psycopg2-binary>=2.9.0",
    "requests>=2.31.0",
]

[project.optional-dependencies]
gis = ["pmtiles>=3.2.0"]
comms = ["meshtastic>=2.3.0"]
tts = [
    "piper-tts>=1.2.0",
]
tts-gpu = [
    "chatterbox-tts>=0.1.0",
]
hardware = [
    "gpiod>=2.1.0",
    "smbus2>=0.4.0",
]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=5.0.0",
    "ruff>=0.4.0",
]

[project.scripts]
vaultmind = "vaultmind.cli:main"

[tool.setuptools.packages.find]
include = ["vaultmind*"]
