# VaultMind Configuration
# =====================

# Local LLM settings
llm:
  # Primary: Qwen3 8B — best quality/size ratio, 5.2GB, verified on Ollama
  model: "qwen3:8b"
  # Fallback: Qwen3 4B — lightweight, 2.5GB, 256K context
  fallback_model: "qwen3:4b"
  # Tiny: Qwen3 0.6B — ultra-light edge, 523MB
  tiny_model: "qwen3:0.6b"
  # Reasoning: Phi4-Reasoning 14B — outperforms 70B models on structured reasoning, 11GB
  reasoning_model: "phi4-reasoning"
  # Edge reasoning: Phi4-Mini-Reasoning 3.8B — 3.2GB, 128K context
  edge_reasoning_model: "phi4-mini-reasoning"
  ollama_host: "http://localhost:11434"

# RAG settings
rag:
  pdf_dir: "data/pdfs"
  index_dir: "data/vault_index"
  chunk_size: 1000
  chunk_overlap: 200
  embedding_model: "sentence-transformers/all-MiniLM-L6-v2"
  top_k: 4

# Knowledge guides
guides:
  enabled: true
  dir: "data/guides"
  include_in_index: true

# Kiwix settings
kiwix:
  enabled: true
  url: "http://localhost:8888"
  zim_dir: "data/zim"

# GIS settings
gis:
  enabled: false
  mbtiles_path: "data/tiles/local.mbtiles"

# Meshtastic settings
comms:
  enabled: false
  serial_port: null  # auto-detect

# Database settings
database:
  # PostgreSQL (primary) or SQLite (edge fallback)
  # Override with VAULTMIND_DATABASE_URL env var
  url: "postgresql://vaultmind:vaultmind@localhost:5432/vaultmind"
  # SQLite fallback for edge devices:
  # url: "sqlite:///data/vaultmind.db"

# Text-to-Speech
tts:
  # Backends tried in order: piper > chatterbox > kokoro > espeak
  preferred_backend: "piper"
  piper:
    model: "en_US-lessac-medium"  # 15-65MB, CPU-friendly
  chatterbox:
    enabled: false  # Requires GPU, 4.5GB VRAM
  output_dir: "data/tts_cache"

# Hardware control
hardware:
  gpio:
    enabled: false
    chip: "gpiochip0"
  i2c:
    enabled: false
    bus: 1
  usb_relay:
    enabled: false
    vendor_id: null
    product_id: null
  automation:
    enabled: false
    rules_file: "config/automation_rules.yaml"

# System monitor
monitor:
  enabled: true
  check_interval_seconds: 300
  warn_cpu_temp_c: 80
  warn_disk_percent: 90
  warn_battery_percent: 20

# Web server
server:
  host: "0.0.0.0"
  port: 8080
  open_webui: false  # Set true to proxy to Open WebUI instead of built-in React UI

