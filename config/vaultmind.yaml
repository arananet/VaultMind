# VaultMind Configuration
# =====================

# Local LLM settings
llm:
  model: "llama3.1:8b-instruct-q4_K_M"
  fallback_model: "mistral:7b-instruct-q4_K_M"
  tiny_model: "phi3:mini-q4_K_M"
  ollama_host: "http://localhost:11434"

# RAG settings
rag:
  pdf_dir: "data/pdfs"
  index_dir: "data/vault_index"
  chunk_size: 1000
  chunk_overlap: 200
  embedding_model: "sentence-transformers/all-MiniLM-L6-v2"
  top_k: 4

# Knowledge guides
guides:
  enabled: true
  dir: "data/guides"
  include_in_index: true

# Kiwix settings
kiwix:
  enabled: true
  url: "http://localhost:8888"
  zim_dir: "data/zim"

# GIS settings
gis:
  enabled: false
  mbtiles_path: "data/tiles/local.mbtiles"

# Meshtastic settings
comms:
  enabled: false
  serial_port: null  # auto-detect

# System monitor
monitor:
  enabled: true
  check_interval_seconds: 300
  warn_cpu_temp_c: 80
  warn_disk_percent: 90
  warn_battery_percent: 20

# Web server
server:
  host: "0.0.0.0"
  port: 8080

